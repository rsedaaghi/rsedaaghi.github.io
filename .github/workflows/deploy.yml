name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure Git identity
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      # build already generates sitemap.json + llms.txt + llms-full.txt
      # AND pre-renders each section as dist/<name>/index.html (real paths
      # for SEO), all from the site data at build time.
      - name: Build the project
        run: npm run build

      - name: Verify build artifacts
        run: |
          for f in dist/index.html dist/sitemap.xml dist/llms.txt dist/llms-full.txt dist/works/index.html dist/skills/index.html dist/contact/index.html; do
            test -f "$f" && echo "OK: $f" || { echo "Error: $f missing"; exit 1; }
          done

      - name: Deploy to GitHub Pages
        run: npx gh-pages -d dist --repo https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/rsedaaghi/rsedaaghi.github.io.git